name: build prerelease

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-exe:
    if: github.ref == 'refs/heads/main'
    environment: prerelease
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: "Python(旧版构建)/依赖/requirements-release.txt"

      - name: Install release dependencies
        run: python -m pip install -r "Python(旧版构建)/依赖/requirements-release.txt"

      - name: Validate CurseForge API key
        shell: pwsh
        env:
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CURSEFORGE_API_KEY)) {
            throw "The prerelease environment secret CURSEFORGE_API_KEY is not configured."
          }

      - name: Build single-file Windows executable
        shell: pwsh
        env:
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
        run: powershell -ExecutionPolicy Bypass -File "Python(旧版构建)/依赖/构建EXE.ps1" -RequireCurseForgeKey

      - name: Verify temporary secret cleanup
        if: always()
        shell: pwsh
        run: |
          if (Test-Path -LiteralPath "Python(旧版构建)/build_secrets.py") {
            throw "Temporary build_secrets.py was not removed."
          }

      - name: Prepare release metadata and licenses
        shell: pwsh
        run: |
          Copy-Item -LiteralPath "Python(旧版构建)/发布/MC整合包工具.exe" -Destination "Python(旧版构建)/发布/MC-Modpack-Tool.exe" -Force
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath "Python(旧版构建)/发布/MC-Modpack-Tool.exe").Hash
          "$hash *MC-Modpack-Tool.exe" | Set-Content -LiteralPath "Python(旧版构建)/发布/SHA256SUMS.txt" -Encoding utf8
          Compress-Archive `
            -Path "Python(旧版构建)/THIRD_PARTY_LICENSES", "Python(旧版构建)/THIRD_PARTY_NOTICES.md" `
            -DestinationPath "Python(旧版构建)/发布/THIRD_PARTY_LICENSES-v1.0.0-beta.1.zip" `
            -CompressionLevel Optimal

      - name: Upload unsigned prerelease artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: MC-Modpack-Tool-v1.0.0-beta.1-windows
          path: |
            Python(旧版构建)/发布/MC-Modpack-Tool.exe
            Python(旧版构建)/发布/SHA256SUMS.txt
            Python(旧版构建)/发布/THIRD_PARTY_LICENSES-v1.0.0-beta.1.zip
            LICENSE
            NOTICE.md
            告示和教程/USER_AGREEMENT.md
            Python(旧版构建)/THIRD_PARTY_NOTICES.md
          if-no-files-found: error
          retention-days: 14
